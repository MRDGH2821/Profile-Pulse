[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/storage",
  "legacy/iced-app",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MRDGH2821/Profile-Pulse"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs"] }
toml = "0.8"
uuid = { version = "1.19", features = ["serde", "v4"] }
vobject = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.24"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1

[profile.dev-opt]
inherits = "dev"
opt-level = 1
