[package]
name = "profile-pulse-storage"
version = "0.1.0"
edition = "2024"
description = "Profile Pulse storage backends"
repository.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
profile-pulse-core = { path = "../core" }
profile-pulse-pic-source-plugin-api = { path = "../pic-source-plugin-api" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
profile-pulse-core = { path = "../core" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["File", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "FileSystemWritableFileStream", "Navigator", "StorageManager", "Window"] }
