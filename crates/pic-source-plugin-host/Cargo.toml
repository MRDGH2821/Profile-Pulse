[package]
name = "profile-pulse-pic-source-plugin-host"
version = "0.1.0"
edition = "2024"
description = "Profile pic source plugin host for Profile Pulse"
repository.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
log.workspace = true
md5.workspace = true
profile-pulse-core = { path = "../core" }
profile-pulse-pic-source-plugin-api = { path = "../pic-source-plugin-api" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
wasmtime.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1.49", features = ["macros", "rt", "sync"] }
