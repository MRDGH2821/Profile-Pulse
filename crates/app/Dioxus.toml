[application]
asset_dir = "assets"
default_platform = "desktop"
# dx uses this name for bundle output paths and identifiers.
name = "profile-pulse"
out_dir = "dist"
public_dir = "public"

[bundle]
category = "Utility"
copyright = "Copyright © 2026 MRDGH2821"
icon = ["icons/icon.png"]
identifier = "com.github.mrdgh2821.profile-pulse"
long_description = """
Profile Pulse is a cross-platform contact manager with social media
integration, cloud sync, and profile picture discovery.
"""
publisher = "MRDGH2821"
resources = ["public/*"]
short_description = "Contact management with social profile integration"

[web.app]
title = "Profile Pulse"

[web.resource]
script = []
# Styles are loaded via asset!() in lib.rs; keep production shell minimal.
style = []

[web.resource.dev]
script = []
style = ["/assets/styles.css"]

[web.wasm_opt]
# z = smallest binary; 4 = fastest compile (dev-friendly).
level = "4"

[web.watcher]
index_on_404 = true
reload_html = true
watch_path = ["src", "assets", "public"]
