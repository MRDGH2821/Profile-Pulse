[package]
name = "profile-pulse-app"
version = "0.1.0"
edition = "2024"
description = "Profile Pulse desktop and web application"
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "profile-pulse"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
dioxus = { version = "0.7", features = ["desktop", "router"] }
directories.workspace = true
profile-pulse-core = { path = "../core" }
profile-pulse-pic-source-plugin-api = { path = "../pic-source-plugin-api" }
profile-pulse-pic-source-plugin-host = { path = "../pic-source-plugin-host" }
profile-pulse-storage = { path = "../storage" }
profile-pulse-sync = { path = "../sync" }
rfd = "0.17.2"
uuid.workspace = true
