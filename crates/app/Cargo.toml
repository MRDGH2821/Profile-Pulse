[package]
name = "profile-pulse-app"
version = "0.1.0"
edition = "2024"
description = "Profile Pulse desktop and web application"
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "profile-pulse"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
dioxus = { version = "0.7", features = ["router"] }
directories = { workspace = true, optional = true }
profile-pulse-core = { path = "../core" }
profile-pulse-pic-source-plugin-api = { path = "../pic-source-plugin-api" }
profile-pulse-pic-source-plugin-host = { path = "../pic-source-plugin-host" }
profile-pulse-storage = { path = "../storage" }
profile-pulse-sync = { path = "../sync" }
rfd = { version = "0.17.2", optional = true }
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[features]
default = ["desktop"]
# dx --platform <name> enables the matching feature (see Dioxus tutorial/new_app)
desktop = ["dep:directories", "dep:rfd", "dioxus/desktop"]
web = ["dioxus/web"]
