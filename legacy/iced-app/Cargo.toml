[package]
name = "profile-pulse-legacy"
version = "0.1.0"
edition = "2024"
description = "Legacy Iced desktop app (frozen — superseded by Dioxus rewrite)"
readme = "../../README.md"
repository = "https://github.com/MRDGH2821/Profile-Pulse"
license = "GPL-3.0-or-later"
keywords = ["contacts", "desktop", "social-media", "vcard", "vcf"]
categories = ["gui", "network-programming"]
publish = false

[[bin]]
name = "profile-pulse-legacy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
dotenv = "0.15.0"
dotenvy = "0.15.7"
governor = "0.10.4"
iced = { version = "0.14.0", features = ["debug", "image", "tokio"] }
image = { version = "0.25.9", features = ["jpeg", "png", "webp"] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", features = ["cookies", "json"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
rfd = "0.17.2"
scraper = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["serde", "v4"] }
vobject = "0.8"

[dev-dependencies]
mockito = "1.7"
tempfile = "3.24"
tokio-test = "0.4"
